name: Deploy to gh-pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build for Yqnn/svg-path-editor
        if: ${{ secrets.GH_PAGES_TOKEN != '' }}
        run: npm run build:gh

      - name: Build for current repository
        if: ${{ secrets.GH_PAGES_TOKEN == '' }}
        run: npx tsc --noEmit && npx vite build --base=/${{ github.event.repository.name }}/

      # Mirrors the deliverable to Yqnn/svg-path-editor's gh-pages branch when
      # a GH_PAGES_TOKEN (fine-grained PAT with contents:write) is configured.
      - name: Deploy to Yqnn/svg-path-editor
        if: ${{ secrets.GH_PAGES_TOKEN != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Yqnn/svg-path-editor
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # Fallback: publish to this repository's gh-pages branch.
      - name: Deploy to current repository
        if: ${{ secrets.GH_PAGES_TOKEN == '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
